<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>52발췌기</title>

        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700;800&family=Gowun+Dodum&display=swap"
            rel="stylesheet" />
        <link
            rel="stylesheet"
            crossorigin
            href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/subsets/MaruBuri-dynamic-subset.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0/dotum.min.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/TetraTheta/RIDIBatang-subset/dist/style/RIDIBatang-subset-web.css" />

        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="app-shell">
            <!-- ===================== 본문 ===================== -->
            <main class="app-body">
                <!-- 좌측: 편집 패널(아코디언) -->
                <aside class="control-panel">
                    <div class="header-actions">
                        <button id="btnToggleHelp" class="btn btn-ghost" style="color: #ff9800; font-weight: bold">
                            도움말 💡
                        </button>
                        <button id="btnCopy" class="btn btn-ghost">이미지 복사</button>
                        <button id="btnSave" class="btn btn-primary">통합 저장</button>
                        <button id="btnSplitSave" class="btn btn-primary" style="background-color: #6cb13c">
                            분할 저장
                        </button>
                    </div>
                    <div class="panel-scroll">
                        <!-- 1. 콘텐츠 -->
                        <details class="panel-section" open>
                            <summary class="panel-section-header">
                                <span class="section-index">01</span>
                                <span class="section-title">콘텐츠</span>
                            </summary>

                            <div class="panel-section-body" style="display: flex; flex-direction: column; gap: 14px">
                                <details
                                    class="content-toggle-card"
                                    style="
                                        border: 1px solid var(--color-border-light);
                                        border-radius: 6px;
                                        overflow: hidden;
                                        background: #ffffff;
                                    ">
                                    <summary
                                        style="
                                            padding: 10px 12px;
                                            font-size: 12px;
                                            font-weight: 600;
                                            background: #f8fafc;
                                            cursor: pointer;
                                            user-select: none;
                                        ">
                                        📝 타이틀 & 출처
                                    </summary>
                                    <div style="padding: 12px; border-top: 1px solid var(--color-border-light)">
                                        <div class="text-field-block" style="margin-bottom: 10px">
                                            <div
                                                class="text-field-controls"
                                                style="
                                                    display: flex;
                                                    align-items: center;
                                                    justify-content: space-between;
                                                    margin-bottom: 4px;
                                                ">
                                                <label
                                                    for="cardTitleInput"
                                                    class="field-tag"
                                                    style="font-size: 11px; font-weight: 600"
                                                    >제목</label
                                                >
                                                <div style="display: flex; gap: 4px; align-items: center">
                                                    <div class="stepper-minimal stepper-compact">
                                                        <button type="button" onclick="stepInput('titleSize', -1)">
                                                            -
                                                        </button>
                                                        <input type="number" id="titleSize" value="26" />
                                                        <button type="button" onclick="stepInput('titleSize', 1)">
                                                            +
                                                        </button>
                                                    </div>
                                                    <select
                                                        id="titleWeight"
                                                        class="select-compact"
                                                        style="font-size: 11px">
                                                        <option value="500">보통</option>
                                                        <option value="600">중간</option>
                                                        <option value="700" selected>굵게</option>
                                                        <option value="900" selected>아주굵게</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <input
                                                type="text"
                                                id="cardTitleInput"
                                                class="text-field-input"
                                                placeholder="제목 입력 (선택)"
                                                style="width: 100%; padding: 6px; font-size: 11px" />
                                        </div>

                                        <div class="text-field-block" style="margin-bottom: 12px">
                                            <div
                                                class="text-field-controls"
                                                style="
                                                    display: flex;
                                                    align-items: center;
                                                    justify-content: space-between;
                                                    margin-bottom: 4px;
                                                ">
                                                <label
                                                    for="cardSubtitleInput"
                                                    class="field-tag"
                                                    style="font-size: 11px; font-weight: 600"
                                                    >부제목</label
                                                >
                                                <div style="display: flex; gap: 4px; align-items: center">
                                                    <div class="stepper-minimal stepper-compact">
                                                        <button type="button" onclick="stepInput('subtitleSize', -1)">
                                                            -
                                                        </button>
                                                        <input type="number" id="subtitleSize" value="15" />
                                                        <button type="button" onclick="stepInput('subtitleSize', 1)">
                                                            +
                                                        </button>
                                                    </div>
                                                    <select
                                                        id="subtitleWeight"
                                                        class="select-compact"
                                                        style="font-size: 11px">
                                                        <option value="400" selected>보통</option>
                                                        <option value="700">굵게</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <input
                                                type="text"
                                                id="cardSubtitleInput"
                                                class="text-field-input"
                                                placeholder="부제목 입력 (선택)"
                                                style="width: 100%; padding: 6px; font-size: 11px" />
                                        </div>

                                        <div
                                            class="panel-divider"
                                            style="
                                                margin: 8px 0;
                                                border-top: 1px solid var(--color-border-light);
                                            "></div>

                                        <div
                                            class="field-row cols-3"
                                            style="
                                                display: grid;
                                                grid-template-columns: 1fr 1fr 1fr;
                                                gap: 6px;
                                                align-items: center;
                                            ">
                                            <div class="field-col">
                                                <input
                                                    type="text"
                                                    id="titleInput"
                                                    placeholder="작품명"
                                                    style="width: 100%; padding: 5px; font-size: 11px" />
                                            </div>
                                            <div class="field-col">
                                                <input
                                                    type="text"
                                                    id="creatorInput"
                                                    placeholder="제작자"
                                                    style="width: 100%; padding: 5px; font-size: 11px" />
                                            </div>
                                            <div class="field-col" style="display: flex; align-items: center; gap: 4px">
                                                <span
                                                    style="
                                                        font-size: 10px;
                                                        white-space: nowrap;
                                                        color: var(--color-text-sub);
                                                    "
                                                    >여백</span
                                                >
                                                <div class="stepper-minimal" style="height: 25px; flex: 1">
                                                    <button type="button" onclick="stepInput('infoMarginTop', -5)">
                                                        -
                                                    </button>
                                                    <input
                                                        type="number"
                                                        id="infoMarginTop"
                                                        value="35"
                                                        style="font-size: 11px" />
                                                    <button type="button" onclick="stepInput('infoMarginTop', 5)">
                                                        +
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </details>
                                <div
                                    class="content-editor-group"
                                    style="
                                        border: 1px solid var(--color-border);
                                        border-radius: 8px;
                                        padding: 10px;
                                        background: #ffffff;
                                    ">
                                    <div class="editor-toolbar">
                                        <!-- 카테고리 1: 서식 -->
                                        <button
                                            id="btnClearHighlight"
                                            class="btn-editor-pill pill-danger"
                                            data-help="마우스 커서가 있는 줄이나 드래그한 영역의 모든 서식을 지웁니다.">
                                            지우기
                                        </button>
                                        <button
                                            id="btnBold"
                                            class="btn-editor-pill"
                                            data-help="텍스트를 드래그한 뒤 누르면 글씨가 굵어집니다.">
                                            <b>B</b>
                                        </button>
                                        <button
                                            id="btnItalic"
                                            class="btn-editor-pill"
                                            data-help="텍스트를 드래그한 뒤 누르면 글씨가 기울어집니다.">
                                            <i>I</i>
                                        </button>
                                        <button
                                            id="btnQuoteWrap"
                                            class="btn-editor-pill"
                                            data-help="텍스트를 드래그한 뒤 누르면 앞뒤로 따옴표('')를 씌워줍니다.">
                                            “”
                                        </button>
                                        <button
                                            id="btnSubText"
                                            class="btn-editor-pill pill-sub"
                                            data-help="텍스트를 드래그한 뒤 누르면 [03.색상&효과-보조색]이 적용됩니다.">
                                            보조색
                                        </button>

                                        <select
                                            id="selHighlight"
                                            class="toolbar-select"
                                            style="width: 80px"
                                            data-help="텍스트를 드래그하고 형광펜 색상을 선택하면 [03.색상&효과-형광펜]이 칠해집니다.">
                                            <option value="" disabled selected>형광펜</option>
                                            <option value="A">형광A</option>
                                            <option value="B">형광B</option>
                                            <option value="C">형광C</option>
                                        </select>

                                        <div class="toolbar-divider"></div>

                                        <button
                                            id="btnAddTitleBlock"
                                            class="btn-editor-pill pill-blue"
                                            data-help="본문에 [01.콘텐츠-타이틀&출처-제목] 블럭을 추가합니다.">
                                            + 제목
                                        </button>
                                        <button
                                            id="btnAddSubtitleBlock"
                                            class="btn-editor-pill pill-blue"
                                            data-help="본문에 [01.콘텐츠-타이틀&출처-부제목] 블럭을 추가합니다.">
                                            + 부제목
                                        </button>
                                        <button
                                            id="btnAddImage"
                                            class="btn-editor-pill pill-blue"
                                            data-help="본문에 사진을 추가합니다.&#10;추가된 사진의 [좌&우/아래]테두리를 드래그하면 크기를 조절할 수 있습니다.">
                                            + 사진
                                        </button>
                                        <button
                                            id="btnFadeLine"
                                            class="btn-editor-pill pill-blue"
                                            data-help="본문에 꾸밈용 가로 구분선을 추가합니다.">
                                            + 구분선
                                        </button>
                                        <button
                                            id="btnPageBreak"
                                            class="btn-editor-pill pill-blue"
                                            data-help="이 점선을 기준으로 영역을 나눕니다.&#10;상단의 '분할 저장'을 누르면 이 선을 기준으로 이미지가 잘려서 저장됩니다.">
                                            + 페이지 분할선
                                        </button>
                                        <button
                                            id="btnAddHtmlBlock"
                                            class="btn-editor-pill pill-blue"
                                            data-help="본문에 직접 HTML 코드를 작성할 수 있는 HTML 블록을 추가합니다.">
                                            + HTML
                                        </button>
                                        <div class="toolbar-divider"></div>

                                        <button
                                            id="btnQuoteColorB"
                                            class="btn-editor-pill"
                                            data-help="드래그한 텍스트의 색상을 [03.색상&효과-따옴표 B] 색상으로 바꿉니다.">
                                            따옴표B
                                        </button>
                                        <button
                                            id="btnQuoteLineA"
                                            class="btn-editor-pill"
                                            data-help="드래그한 텍스트에 [03.색상&효과-강조선A] 스타일을 적용합니다.">
                                            강조선A
                                        </button>
                                        <button
                                            id="btnQuoteLineB"
                                            class="btn-editor-pill"
                                            data-help="드래그한 텍스트에 [03.색상&효과-강조선B] 스타일을 적용합니다.">
                                            강조선B
                                        </button>
                                        <div class="toolbar-divider"></div>
                                        <button
                                            id="btnAutoQuoteLine"
                                            class="btn-editor-pill pill-green"
                                            data-help="본문의 따옴표를 감지하여 자동으로 강조선 스타일로 한 번에 변환합니다.&#10; [인물명 | “대사”] 형태로 적혀있으면 아래 [말풍선&인물] 설정에 맞춰 컬러가 자동 지정됩니다.">
                                            ⚡자동강조선
                                        </button>

                                        <button
                                            id="btnAutoChatParse"
                                            class="btn-editor-pill pill-green"
                                            data-help="본문의 따옴표를 감지하여 말풍선으로 변환합니다.&#10;[인물명 | “대사”] 형태로 적혀있으면 아래 [말풍선&인물] 설정에 맞춰 컬러가 자동 지정됩니다.&#10;인물 변경은 프로필 사진 클릭&#10;">
                                            ⚡자동말풍선
                                        </button>
                                    </div>

                                    <input type="file" id="inlineImageInput" accept="image/*" style="display: none" />
                                    <div id="textEditor" contenteditable="true" placeholder="내용을 입력하세요."></div>
                                </div>
                                <details
                                    class="content-toggle-card"
                                    style="
                                        border: 1px solid var(--color-border-light);
                                        border-radius: 6px;
                                        overflow: hidden;
                                        background: #ffffff;
                                    ">
                                    <summary
                                        style="
                                            padding: 10px 12px;
                                            font-size: 12px;
                                            font-weight: 600;
                                            background: #f8fafc;
                                            cursor: pointer;
                                            user-select: none;
                                        "
                                        data-help="자동강조선&자동말풍선 적용 시 적용될 인물별 프로필과 색상을 설정하는 곳입니다.">
                                        💬 말풍선 & 인물
                                    </summary>
                                    <div style="padding: 12px; border-top: 1px solid var(--color-border-light)">
                                        <div class="character-control-panel">
                                            <button
                                                id="btnAddMember"
                                                type="button"
                                                class="character-add-btn"
                                                data-help="새로운 인물 카드를 추가합니다.(왼쪽)">
                                                <span class="character-add-icon">+</span>
                                                <span class="character-add-text">
                                                    <strong>인물 추가</strong>
                                                    <small>새 캐릭터 등록</small>
                                                </span>
                                            </button>
                                            <div class="character-options">
                                                <label
                                                    class="character-option"
                                                    data-help="체크 시, 대사에 괄호()가 있을 때 자동으로 줄을 바꿔줍니다.">
                                                    <input type="checkbox" id="autoParenBreak" checked /> 줄바꿈
                                                </label>
                                                <label
                                                    class="character-option"
                                                    data-help="모든 말풍선에서 프로필 사진을 숨기거나 표시합니다.">
                                                    <input type="checkbox" id="toggleProfile" checked /> 프사
                                                </label>
                                                <label
                                                    class="character-option"
                                                    data-help="모든 말풍선에서 인물 이름을 숨기거나 표시합니다.">
                                                    <input type="checkbox" id="toggleName" checked /> 이름
                                                </label>
                                                <label
                                                    class="character-option"
                                                    data-help="말풍선 안의 큰따옴표를 숨기거나 표시합니다.">
                                                    <input type="checkbox" id="toggleQuotes" /> 따옴표
                                                </label>
                                                <label
                                                    class="character-option opacity-option"
                                                    for="bubbleBgOpacity"
                                                    data-help="숫자를 바꾸면 왼쪽/오른쪽 모든 말풍선 배경 투명도가 한 번에 적용됩니다. (0=완전투명, 100=불투명)">
                                                    투명도
                                                    <span class="opacity-control">
                                                        <button
                                                            type="button"
                                                            onclick="stepInput('bubbleBgOpacity', -5)">
                                                            -
                                                        </button>
                                                        <input
                                                            type="number"
                                                            id="bubbleBgOpacity"
                                                            value="100"
                                                            min="0"
                                                            max="100" />
                                                        <button type="button" onclick="stepInput('bubbleBgOpacity', 5)">
                                                            +
                                                        </button>
                                                    </span>
                                                </label>
                                            </div>
                                        </div>
                                        <div class="member-list-grid">
                                            <div
                                                class="member-card member-card-fixed"
                                                data-help="오른쪽에 배치될 말풍선의 배경색, 따옴표색, 괄호색을 설정합니다.">
                                                <div class="member-card-top">
                                                    <div class="member-avatar-btn" style="background-color: #7081ff">
                                                        💬
                                                    </div>
                                                    <div class="member-name-fixed">
                                                        오른쪽 말풍선
                                                        <span style="font-size: 10px; opacity: 0.6">🔒</span>
                                                    </div>
                                                </div>
                                                <div class="member-colors-row">
                                                    <label
                                                        class="member-color-item"
                                                        data-help="말풍선의 배경색을 지정합니다.">
                                                        <input type="color" id="bubbleColorRight" value="#7081ff" />
                                                        <span>배경</span>
                                                    </label>

                                                    <label
                                                        class="member-color-item"
                                                        data-help="말풍선 안의 따옴표 색상을 지정합니다.">
                                                        <input type="color" id="quoteColorC" value="#e5eeff" />
                                                        <span>따옴표</span>
                                                    </label>

                                                    <label
                                                        class="member-color-item"
                                                        data-help="말풍선 안의 괄호 색상을 지정합니다.">
                                                        <input type="color" id="parenColorB" value="#d0d7ff" />
                                                        <span>괄호</span>
                                                    </label>
                                                </div>
                                            </div>

                                            <div id="memberListContainer" style="display: contents"></div>
                                        </div>
                                    </div>
                                </details>
                            </div>
                        </details>
                        <!-- 2. 캔버스 & 배경 -->
                        <details class="panel-section">
                            <summary class="panel-section-header">
                                <span class="section-index">02</span>
                                <span class="section-title">캔버스 &amp; 배경</span>
                            </summary>
                            <div class="panel-section-body">
                                <div class="field-row cols-2">
                                    <div class="field-col">
                                        <label>캔버스 비율</label>
                                        <input type="hidden" id="ratioSelect" value="free" />
                                        <div
                                            class="segmented-control segmented-control-minimal"
                                            data-target="ratioSelect">
                                            <button type="button" data-value="1:1">1:1</button>
                                            <button type="button" data-value="4:5">4:5</button>
                                            <button type="button" data-value="16:9">16:9</button>
                                            <button type="button" data-value="9:16">9:16</button>
                                            <button type="button" data-value="free" class="active">자동</button>
                                        </div>
                                        <div class="field-col" style="margin-top: 10px">
                                            <label>열 레이아웃</label>
                                            <input type="hidden" id="layoutSelect" value="1column" />
                                            <div
                                                class="segmented-control segmented-control-minimal"
                                                data-target="layoutSelect">
                                                <button type="button" data-value="1column" class="active">
                                                    일반(1열)
                                                </button>
                                                <button type="button" data-value="2column">책 내지(2열)</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="field-col" id="customWidthArea">
                                        <label for="canvasWidth">지정 너비 (px)</label>
                                        <div class="stepper-minimal">
                                            <button onclick="stepInput('canvasWidth', -50)">-</button>
                                            <input type="number" id="canvasWidth" value="600" />
                                            <button onclick="stepInput('canvasWidth', 50)">+</button>
                                        </div>
                                        <div
                                            class="field-col"
                                            id="midGapArea"
                                            style="display: none; grid-column: span 2; margin-top: 8px">
                                            <label for="midGap" style="display: flex; justify-content: space-between">
                                                <span>책 내지 중간 여백</span>
                                                <span id="midGapVal" style="font-weight: bold; color: #10b981"
                                                    >40px</span
                                                >
                                            </label>
                                            <input
                                                type="range"
                                                id="midGap"
                                                min="10"
                                                max="150"
                                                value="40"
                                                style="width: 100%; cursor: pointer" />
                                        </div>
                                    </div>
                                </div>

                                <div class="field-row cols-2">
                                    <div class="field-col">
                                        <label for="paddingX">가로 여백</label>
                                        <div class="stepper-minimal">
                                            <button onclick="stepInput('paddingX', -5)">-</button>
                                            <input type="number" id="paddingX" value="50" />
                                            <button onclick="stepInput('paddingX', 5)">+</button>
                                        </div>
                                    </div>
                                    <div class="field-col">
                                        <label for="paddingY">세로 여백</label>
                                        <div class="stepper-minimal">
                                            <button onclick="stepInput('paddingY', -5)">-</button>
                                            <input type="number" id="paddingY" value="70" />
                                            <button onclick="stepInput('paddingY', 5)">+</button>
                                        </div>
                                    </div>
                                </div>

                                <div class="panel-divider"></div>

                                <div class="panel-section-title">배경</div>
                                <div class="field-row cols-2">
                                    <!-- 배경 타입 -->
                                    <div class="field-col">
                                        <label>배경 타입</label>
                                        <input type="hidden" id="bgType" value="color" />
                                        <div class="segmented-control segmented-control-minimal" data-target="bgType">
                                            <button type="button" data-value="color" class="active">단색</button>
                                            <button type="button" data-value="grad2">2색</button>
                                            <button type="button" data-value="grad3">3색</button>
                                            <button type="button" data-value="image">이미지</button>
                                        </div>
                                    </div>

                                    <!-- 방향 (그라데이션 방향) -->
                                    <div class="field-col" id="gradientDirWrapper" style="display: none">
                                        <label>방향</label>
                                        <input type="hidden" id="gradientDir" value="to bottom" />
                                        <div
                                            class="segmented-control segmented-control-minimal"
                                            data-target="gradientDir">
                                            <button type="button" data-value="to right">가로</button>
                                            <button type="button" data-value="to bottom" class="active">세로</button>
                                            <button type="button" data-value="to bottom right">대각선</button>
                                        </div>
                                    </div>
                                </div>

                                <!-- 배경색 선택: 스와치 3열 -->
                                <div class="swatch-grid cols-3" id="gradientPickerContainer">
                                    <div class="swatch-cell" id="grad1Wrapper">
                                        <input type="color" id="gradColor1" value="#ffffff" />
                                        <span id="gradColor1Label">배경 A</span>
                                    </div>
                                    <div class="swatch-cell" id="grad2Wrapper">
                                        <input type="color" id="gradColor2" value="#e5ded0" />
                                        <span>배경 B</span>
                                    </div>
                                    <div class="swatch-cell" id="grad3Wrapper">
                                        <input type="color" id="gradColor3" value="#cbbfa4" />
                                        <span>배경 C</span>
                                    </div>
                                </div>

                                <!-- 배경 이미지 컨트롤 -->
                                <div id="bgImageControls" class="field-card">
                                    <div class="field-col field-col-full">
                                        <label>이미지 파일</label>
                                        <input type="file" id="bgImageInput" accept="image/*" />
                                    </div>

                                    <div class="field-row cols-2">
                                        <div class="field-col">
                                            <label>크기</label>
                                            <input type="range" id="bgImageSize" min="10" max="200" value="100" />
                                        </div>
                                        <div class="field-col">
                                            <label>블러</label>
                                            <input type="range" id="bgImageBlur" min="0" max="20" value="0" />
                                        </div>
                                        <div class="field-col">
                                            <label>가로 위치</label>
                                            <input type="range" id="bgImageX" min="0" max="100" value="50" />
                                        </div>
                                        <div class="field-col">
                                            <label>세로 위치</label>
                                            <input type="range" id="bgImageY" min="0" max="100" value="50" />
                                        </div>
                                        <div class="field-col">
                                            <label for="bgOverlayColor">오버레이색</label>
                                            <input type="color" id="bgOverlayColor" value="#000000" />
                                        </div>
                                        <div class="field-col">
                                            <label>투명도</label>
                                            <input
                                                type="range"
                                                id="bgOverlayOpacity"
                                                min="0"
                                                max="1"
                                                step="0.05"
                                                value="0" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </details>

                        <!-- 3. 타이포그래피 -->
                        <details class="panel-section">
                            <summary class="panel-section-header">
                                <span class="section-index">03</span>
                                <span class="section-title">타이포그래피</span>
                            </summary>
                            <div class="panel-section-body">
                                <div class="field-row cols-2">
                                    <div class="field-col">
                                        <label for="fontSelect">서체</label>
                                        <select id="fontSelect">
                                            <option value="'Pretendard', sans-serif">프리텐다드</option>
                                            <option value="'Maru Buri', serif">마루부리</option>
                                            <option value="'KoPubWorld Dotum', sans-serif">KoPubWorld 돋움</option>
                                            <option value="'RIDIBatang-subset', serif">리디바탕</option>
                                            <option value="'Noto Serif KR', serif">Noto Serif KR</option>
                                            <option value="'ChosunIlboMyungjo', serif">조선일보명조</option>
                                        </select>
                                    </div>
                                    <div class="field-col">
                                        <label>본문 굵기</label>
                                        <input type="hidden" id="bodyWeight" value="400" />
                                        <div
                                            class="segmented-control segmented-control-minimal"
                                            data-target="bodyWeight">
                                            <button type="button" data-value="300">얇게</button>
                                            <button type="button" data-value="400" class="active">
                                                약간<br />얇게
                                            </button>
                                            <button type="button" data-value="500">보통</button>
                                            <button type="button" data-value="600">약간<br />굵게</button>
                                            <button type="button" data-value="700">굵게</button>
                                        </div>
                                    </div>
                                </div>

                                <div class="field-row cols-2">
                                    <div class="field-col">
                                        <label>정렬</label>
                                        <input type="hidden" id="alignH" value="left" />
                                        <div class="segmented-control segmented-control-minimal" data-target="alignH">
                                            <button type="button" data-value="left" class="active">좌</button>
                                            <button type="button" data-value="center">중</button>
                                            <button type="button" data-value="right">우</button>
                                            <button type="button" data-value="justify">양쪽</button>
                                        </div>
                                    </div>
                                    <div class="field-col">
                                        <label>줄바꿈</label>
                                        <input type="hidden" id="wordBreak" value="keep-all" />
                                        <div
                                            class="segmented-control segmented-control-minimal"
                                            data-target="wordBreak">
                                            <button type="button" data-value="keep-all" class="active">
                                                단어 단위
                                            </button>
                                            <button type="button" data-value="break-all">글자 단위</button>
                                        </div>
                                    </div>
                                </div>

                                <div class="panel-divider"></div>

                                <!-- 본문 간격 디테일 (5열로 한 줄 배치) -->
                                <div class="panel-section-title">본문 간격 디테일</div>
                                <div class="field-row cols-5">
                                    <div class="field-col">
                                        <label for="fontSize">크기 (px)</label>
                                        <div class="stepper-minimal">
                                            <button type="button" onclick="stepInput('fontSize', -1)">-</button>
                                            <input type="number" id="fontSize" value="16" />
                                            <button type="button" onclick="stepInput('fontSize', 1)">+</button>
                                        </div>
                                    </div>
                                    <div class="field-col">
                                        <label for="letterSpacing">자간 (px)</label>
                                        <div class="stepper-minimal">
                                            <button type="button" onclick="stepInput('letterSpacing', -0.5, 2)">
                                                -
                                            </button>
                                            <input type="number" id="letterSpacing" value="-0.5" step="0.5" />
                                            <button type="button" onclick="stepInput('letterSpacing', 0.5, 2)">
                                                +
                                            </button>
                                        </div>
                                    </div>
                                    <div class="field-col">
                                        <label for="lineHeight">행간 (px)</label>
                                        <div class="stepper-minimal">
                                            <button type="button" onclick="stepInput('lineHeight', -2)">-</button>
                                            <input type="number" id="lineHeight" value="22" />
                                            <button type="button" onclick="stepInput('lineHeight', 2)">+</button>
                                        </div>
                                    </div>
                                    <div class="field-col">
                                        <label for="paraSpacing">문단 (px)</label>
                                        <div class="stepper-minimal">
                                            <button type="button" onclick="stepInput('paraSpacing', -2)">-</button>
                                            <input type="number" id="paraSpacing" value="14" />
                                            <button type="button" onclick="stepInput('paraSpacing', 2)">+</button>
                                        </div>
                                    </div>
                                    <div class="field-col">
                                        <label for="fontScaleX">장평 (%)</label>
                                        <div class="stepper-minimal">
                                            <button type="button" onclick="stepInput('fontScaleX', -1)">-</button>
                                            <input type="number" id="fontScaleX" value="98" />
                                            <button type="button" onclick="stepInput('fontScaleX', 1)">+</button>
                                        </div>
                                    </div>
                                </div>

                                <div class="panel-divider" style="margin: 8px 0"></div>

                                <div class="panel-section-title">말풍선 간격 디테일</div>
                                <div class="bubble-detail-grid">
                                    <div class="field-col">
                                        <label for="bubbleFontSize">글자크기</label>
                                        <div class="stepper-minimal">
                                            <button type="button" onclick="stepInput('bubbleFontSize', -1)">-</button>
                                            <input type="number" id="bubbleFontSize" value="15" />
                                            <button type="button" onclick="stepInput('bubbleFontSize', 1)">+</button>
                                        </div>
                                    </div>
                                    <div class="field-col">
                                        <label for="bubbleLineHeight">행간</label>
                                        <div class="stepper-minimal">
                                            <button type="button" onclick="stepInput('bubbleLineHeight', -2)">-</button>
                                            <input type="number" id="bubbleLineHeight" value="20" />
                                            <button type="button" onclick="stepInput('bubbleLineHeight', 2)">+</button>
                                        </div>
                                    </div>
                                    <div class="field-col">
                                        <label for="bubblePadding">내부여백</label>
                                        <div class="stepper-minimal">
                                            <button type="button" onclick="stepInput('bubblePadding', -2)">-</button>
                                            <input type="number" id="bubblePadding" value="12" />
                                            <button type="button" onclick="stepInput('bubblePadding', 2)">+</button>
                                        </div>
                                    </div>
                                    <div class="field-col">
                                        <label for="bubbleGap">간격 (px)</label>
                                        <div class="stepper-minimal">
                                            <button type="button" onclick="stepInput('bubbleGap', -2)">-</button>
                                            <input type="number" id="bubbleGap" value="12" />
                                            <button type="button" onclick="stepInput('bubbleGap', 2)">+</button>
                                        </div>
                                    </div>
                                    <div class="field-col">
                                        <label for="bubbleNameGap">이름간격</label>
                                        <div class="stepper-minimal">
                                            <button type="button" onclick="stepInput('bubbleNameGap', -1)">-</button>
                                            <input type="number" id="bubbleNameGap" value="4" />
                                            <button type="button" onclick="stepInput('bubbleNameGap', 1)">+</button>
                                        </div>
                                    </div>
                                    <div class="field-col">
                                        <label for="bubbleWidth">너비 (%)</label>
                                        <div class="stepper-minimal">
                                            <button type="button" onclick="stepInput('bubbleWidth', -5)">-</button>
                                            <input type="number" id="bubbleWidth" value="75" />
                                            <button type="button" onclick="stepInput('bubbleWidth', 5)">+</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </details>

                        <!-- 4. 색상 & 효과 -->
                        <details class="panel-section">
                            <summary class="panel-section-header">
                                <span class="section-index">04</span>
                                <span class="section-title">색상 &amp; 효과</span>
                            </summary>
                            <div class="panel-section-body">
                                <!-- 텍스트/강조선 색상 -->
                                <div class="panel-section-title">텍스트 &amp; 강조선</div>
                                <div class="swatch-grid cols-4">
                                    <div class="swatch-cell">
                                        <input type="color" id="globalTextColor" value="#383838" />
                                        <span>글자색</span>
                                    </div>
                                    <div class="swatch-cell">
                                        <input type="color" id="subTextColor" value="#5b70be" />
                                        <span>보조색</span>
                                    </div>
                                    <div class="swatch-cell">
                                        <input type="color" id="quoteLineColorA" value="#61b1b3" />
                                        <span>강조선A</span>
                                    </div>
                                    <div class="swatch-cell">
                                        <input type="color" id="quoteLineColorB" value="#f3b55e" />
                                        <span>강조선B</span>
                                    </div>
                                </div>

                                <!-- 형광펜 색상 -->
                                <div class="panel-section-title">형광펜</div>
                                <div class="swatch-grid cols-3">
                                    <div class="swatch-cell">
                                        <input type="color" id="hlColorA" value="#fff0fc" />
                                        <span>형광A</span>
                                    </div>
                                    <div class="swatch-cell">
                                        <input type="color" id="hlColorB" value="#fffbe0" />
                                        <span>형광B</span>
                                    </div>
                                    <div class="swatch-cell">
                                        <input type="color" id="hlColorC" value="#e5f0ff" />
                                        <span>형광C</span>
                                    </div>
                                </div>

                                <div class="panel-section-title">스마트 하이라이트</div>

                                <div class="checkbox-minimal-group checkbox-row">
                                    <label><input type="checkbox" id="enableQuoteColor" checked /> 따옴표 감지</label>
                                    <label><input type="checkbox" id="enableParenColor" checked /> 괄호 감지</label>
                                    <label><input type="checkbox" id="enableTextShadow" /> 그림자 효과</label>
                                </div>

                                <div class="swatch-grid cols-5">
                                    <div class="swatch-cell">
                                        <input type="color" id="quoteColorA" value="#61b1b3" />
                                        <span>따옴표 A</span>
                                    </div>
                                    <div class="swatch-cell">
                                        <input type="color" id="quoteColorB" value="#f3b55e" />
                                        <span>따옴표 B</span>
                                    </div>
                                    <div class="swatch-cell" id="parenColorWrapper">
                                        <input type="color" id="parenColorA" value="#bac0c4" />
                                        <span>괄호색</span>
                                    </div>

                                    <div class="swatch-cell">
                                        <input type="color" id="textShadowColor" value="#000000" />
                                        <span>그림자색</span>
                                    </div>
                                    <div class="swatch-cell shadow-blur-cell">
                                        <div class="stepper-minimal">
                                            <button type="button" onclick="stepInput('textShadowBlur', -1)">-</button>
                                            <input type="number" id="textShadowBlur" value="4" />
                                            <button type="button" onclick="stepInput('textShadowBlur', 1)">+</button>
                                        </div>
                                        <span>그림자 크기</span>
                                    </div>
                                </div>
                            </div>
                        </details>
                        <!-- 5. 프리셋 -->
                        <details class="panel-section">
                            <summary class="panel-section-header">
                                <span class="section-index">05</span>
                                <span class="section-title">디자인 프리셋</span>
                            </summary>
                            <div class="panel-section-body">
                                <div class="preset-save-box-minimal">
                                    <input type="text" id="presetNameInput" placeholder="프리셋 이름 입력" />
                                    <button class="btn-minimal-save" onclick="savePreset()">저장</button>
                                </div>
                                <div class="preset-list-scroll" id="presetList"></div>
                            </div>
                        </details>
                    </div>
                </aside>
                <!-- 우측: 캔버스 미리보기 -->
                <section class="stage">
                    <div class="stage-scroll">
                        <div id="captureArea">
                            <div class="bg-image-layer" id="bgImageLayer"></div>
                            <div class="bg-overlay-layer" id="bgOverlayLayer"></div>

                            <div id="canvasContentContainer">
                                <div id="canvasTitleWrapper" class="canvas-title"></div>
                                <div id="canvasSubtitleWrapper" class="canvas-subtitle"></div>
                                <div id="canvasTextContainer">
                                    <div id="canvasTextWrapper"></div>
                                </div>
                                <div class="info-area" id="canvasInfo"></div>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
        <div id="mouseTooltip" class="mouse-tooltip"></div>
        <script src="presets.js"></script>
        <script src="script.js"></script>
    </body>
</html>
